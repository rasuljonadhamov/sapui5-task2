#XCOL: Column header for the book ID
columnId=ID

#XCOL: Column header for the book name
columnName=Name

#XCOL: Column header for the book author
columnAuthor=Author

#XCOL: Column header for the book genre
columnGenre=Genre

#XCOL: Column header for the book release date
